<style>
:root{--bg:#F5F7F6;--card:#fff;--ink:#10201C;--mut:#4A5B56;--ac:#0F6B5C;--soft:#E3EEEA;--line:#C9D6D1;--dk:#10201C;--dkt:#F5F7F6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1715;--card:#14231F;--ink:#EAF1EE;--mut:#A9BAB4;--ac:#5CC4AE;--soft:#122A25;--line:#2A423B;--dk:#06100E;--dkt:#EAF1EE}}
:root[data-theme="dark"]{--bg:#0D1715;--card:#14231F;--ink:#EAF1EE;--mut:#A9BAB4;--ac:#5CC4AE;--soft:#122A25;--line:#2A423B;--dk:#06100E;--dkt:#EAF1EE}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Source Sans 3',system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Sora',system-ui,sans-serif;margin:0}
a{color:var(--ac)}
button{font:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.logo{font-weight:700;font-size:22px;background:none;border:0;color:var(--ink)}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{background:none;border:0;color:var(--mut);padding:8px 12px;border-radius:8px;font-weight:600}
nav button.on{background:var(--soft);color:var(--ac)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;padding:7px 12px;color:var(--mut);font-weight:600}
.lang button.on{background:var(--ac);color:#fff}
main{max-width:1100px;margin:0 auto;padding:40px 20px 72px}
.eyebrow{font-size:13px;letter-spacing:.12em;font-weight:600;color:var(--ac)}
h1{font-size:clamp(32px,6vw,52px);line-height:1.12;margin:12px 0 16px;max-width:780px}
h2{font-size:clamp(24px,4vw,34px);margin:0 0 8px}
.lead{color:var(--mut);max-width:640px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:24px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.card h3{font-size:19px;margin-bottom:8px}
.card p{margin:0 0 10px;color:var(--mut)}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 20px;font-weight:600;text-decoration:none}
.btn.o{background:none;border:2px solid var(--ac);color:var(--ac);padding:9px 18px}
.tag{display:inline-block;font-size:13px;font-weight:600;background:var(--soft);color:var(--ac);border-radius:6px;padding:2px 8px;margin-bottom:8px}
.note{font-size:14px;color:var(--mut)}
.band{background:var(--dk);color:var(--dkt);border-radius:14px;padding:28px;margin:28px 0}
.band p{color:inherit;opacity:.85;margin:6px 0 0}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
label{display:block;font-weight:600;margin:14px 0 6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.bar2{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:8px 0}
.bar2 i{display:block;height:100%;background:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-height:220px;max-height:55vh;overflow-y:auto;margin-bottom:12px}
.m{margin:0 0 12px;padding:10px 14px;border-radius:10px;white-space:pre-wrap}
.m.u{background:var(--soft);margin-left:12%}
.m.a{border:1px solid var(--line);margin-right:12%}
ul{padding-left:20px;margin:6px 0}
li{margin:4px 0}
footer{border-top:1px solid var(--line);padding:24px 20px;text-align:center;font-size:14px;color:var(--mut)}
.warn{border-left:4px solid var(--ac);background:var(--soft);padding:14px 18px;border-radius:8px;margin:20px 0}
</style>
</head>
